name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Tests for the checkers
        run: python -m unittest discover -s tools/tests

      - name: Orthography
        run: python -m bargardan_tools.normalize --check

      - name: Style and terminology
        run: python -m tools.check_terms --check

      - name: Parity
        run: python -m bargardan_tools.check_parity --check

      - name: Apparatus check
        run: python tools/apparatus.py --check
