name: release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      OSFONTDIR: "/usr/share/fonts//"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX and Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
          quarto install tinytex --no-prompt
          fc-cache -f

      - name: Render Full Book
        run: quarto render

      - name: Render Mobile PDF
        run: quarto render --profile mobile --to pdf

      - name: Package Release Artifacts
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then version="0.0.2"; fi
          mkdir -p dist
          cp _book/*.pdf "dist/lao-tzu-taoteching-farsi-${version}.pdf"
          cp _book/*.epub "dist/lao-tzu-taoteching-farsi-${version}.epub"
          cp _book-mobile/*.pdf "dist/lao-tzu-taoteching-farsi-${version}-mobile.pdf"
          tar -czf "dist/lao-tzu-taoteching-farsi-${version}-html.tar.gz" -C _book .

          # Unversioned copies of the same four files for kaavehdev.ir releases/latest/download
          cp "dist/lao-tzu-taoteching-farsi-${version}.pdf"           dist/lao-tzu-taoteching-farsi.pdf
          cp "dist/lao-tzu-taoteching-farsi-${version}-mobile.pdf"    dist/lao-tzu-taoteching-farsi-mobile.pdf
          cp "dist/lao-tzu-taoteching-farsi-${version}.epub"          dist/lao-tzu-taoteching-farsi.epub
          cp "dist/lao-tzu-taoteching-farsi-${version}-html.tar.gz"   dist/lao-tzu-taoteching-farsi-html.tar.gz

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Quarto emits only relative asset paths, so the bundle is relocatable.
      # Assert it, because kaavehdev.ir serves it from
      # /translations/lao-tzu-taoteching/ and a root-absolute path would 404
      # there only — silently, and only in production.
      - name: Bundle is relocatable
        run: |
          if grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | grep -q .; then
            echo "Root-absolute asset paths found; this will break under /translations/lao-tzu-taoteching/:"
            grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "all asset paths are relative"

      # Quarto reuses a chapter's heading verbatim for the sidebar and for
      # <title>, and neither gets the inline processing the page body gets. A
      # heading carrying a note marker therefore ships as raw Markdown in the
      # nav of every page, and bidi scrambles it on screen. The nav is where it
      # always shows, so one grep covers it.
      - name: No Markdown leaks into the sidebar
        run: |
          if grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | grep -q .; then
            echo "Raw Markdown in the sidebar; a chapter heading is carrying inline markup:"
            grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "no Markdown in the sidebar"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lao-tzu-taoteching-farsi-${{ steps.name.outputs.version }}.pdf
            dist/lao-tzu-taoteching-farsi-${{ steps.name.outputs.version }}-mobile.pdf
            dist/lao-tzu-taoteching-farsi-${{ steps.name.outputs.version }}.epub
            dist/lao-tzu-taoteching-farsi-${{ steps.name.outputs.version }}-html.tar.gz
            dist/lao-tzu-taoteching-farsi.pdf
            dist/lao-tzu-taoteching-farsi-mobile.pdf
            dist/lao-tzu-taoteching-farsi.epub
            dist/lao-tzu-taoteching-farsi-html.tar.gz
          generate_release_notes: true
          body: |
            نسخهٔ کامل برگردان فارسی کتاب **دائو دِ جینگِ لائوتزو** (*Lao-tzu's Taoteching* / 老子道德經) همراه با گزیدهٔ تفسیرهای دو هزار سال گذشته — ترجمه و شرح رِد پاین (بیل پورتر).
            
            - **PDF رومیزی**: حروف‌چینی شده با لولاتک و قلم وزیرمتن همراه با متن و کتیبه‌های چینی باستان.
            - **PDF موبایل**: چیدمان بهینه‌شده برای نمایش در صفحهٔ گوشی‌های هوشمند.
            - **EPUB**: نسخهٔ استاندارد کتاب الکترونیک با جهت راست‌به‌چپ و قلم‌های تعبیه‌شده.
            
            پروانهٔ متن فارسی: CC BY-SA 4.0. پروانهٔ کدهای ابزار مخزن: MIT.

      # Rebuild kaavehdev.ir, which fetches releases/latest/download/
      - name: Rebuild kaavehdev.ir
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SITE_DEPLOY_HOOK_URL is not set; skipping the site rebuild."
            exit 0
          fi
          response=$(curl -fsS -X POST "$HOOK")
          echo "$response"
          echo "$response" | grep -q '"success": *true' || {
            echo "Deploy hook did not report success."
            exit 1
          }
