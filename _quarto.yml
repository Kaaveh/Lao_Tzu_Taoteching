book-version: "نسخهٔ ۰.۰.۲"
book-date: "۲۸ شهریور ۱۴۰۵"

project:
  type: book
  output-dir: _book

resource-path:
  - "."

book:
  title: "دائو دِ جینگِ لائوتزو"
  subtitle: "با گزیدهٔ تفسیرهای دو هزار سال گذشته — ترجمه و شرح رِد پاین"
  author: "کاوه"

  repo-url: https://github.com/Kaaveh/Lao_Tzu_Taoteching
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  search: true

  sidebar:
    style: docked
    collapse-level: 1

  chapters:
    - index.md
    - fa/title-page.md
